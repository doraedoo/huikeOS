<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开始体验回客 - 回客 Relationship OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6D4AFF;
            --secondary: #FF6EC7;
            --bg: #FFFFFF;
            --text-main: #111827;
            --text-muted: #4B5563;
            --border: #E5E7EB;
            --bg-light: #FAFAFA;
        }
        html { scroll-behavior: smooth; overflow-x: hidden; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); overflow-x: hidden; max-width: 100%; }
        h1, h2, h3, h4, h5, h6 { font-family: 'Noto Serif SC', serif; font-weight: 600; letter-spacing: -0.02em; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
        a { color: inherit; text-decoration: none; }

        /* 氛围光 */
        .ambient-glow { position: absolute; border-radius: 50%; filter: blur(180px); pointer-events: none; }
        .ambient-glow-1 { width: 1000px; height: 1000px; background: radial-gradient(circle, rgba(109, 74, 255, 0.10) 0%, transparent 70%); top: -300px; left: -200px; }
        .ambient-glow-2 { width: 800px; height: 800px; background: radial-gradient(circle, rgba(255, 110, 199, 0.06) 0%, transparent 70%); bottom: -200px; right: -300px; }

        /* 导航 */
        .top-nav {
            position: fixed; top: 0; left: 0; right: 0; height: 72px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(229, 231, 235, 0.5);
            z-index: 100; display: flex; align-items: center;
        }
        .top-nav-inner {
            max-width: 1200px; margin: 0 auto; padding: 0 40px;
            width: 100%; display: flex; justify-content: space-between; align-items: center;
        }
        .top-nav-logo { display: flex; flex-direction: column; text-decoration: none; }
        .top-nav-links { display: flex; align-items: center; gap: 36px; }
        .top-nav-link { font-size: 14px; font-weight: 500; color: var(--text-muted); text-decoration: none; transition: color 0.2s; font-family: 'Inter', sans-serif; }
        .top-nav-link:hover { color: var(--text-main); }
        .top-nav-btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 10px 24px; border-radius: 6px; font-size: 14px; font-weight: 500;
            background: var(--primary); color: #FFFFFF; text-decoration: none;
            transition: background 0.2s; font-family: 'Inter', sans-serif;
        }
        .top-nav-btn:hover { background: #1f2937; }
        .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; background: none; border: none; }
        .hamburger span { display: block; width: 22px; height: 2px; background: var(--text-main); border-radius: 2px; transition: all 0.3s; }
        .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
        .mobile-menu {
            display: none; position: fixed; top: 72px; left: 0; right: 0;
            background: rgba(255,255,255,0.98); backdrop-filter: blur(20px);
            flex-direction: column; z-index: 99;
            border-bottom: 1px solid var(--border);
        }
        .mobile-menu.open { display: flex; }
        .mobile-menu-link { padding: 16px 24px; font-size: 15px; color: var(--text-muted); border-bottom: 1px solid var(--border); font-family: 'Inter', sans-serif; }
        .mobile-menu-link:last-child { border-bottom: none; }

        /* 主内容 */
        .main-section {
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 80px 40px 60px;
            position: relative; overflow: hidden;
        }

        /* 表单卡片 */
        .form-card {
            width: 100%; max-width: 580px;
            position: relative; z-index: 1;
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.05), 0 1px 4px rgba(0,0,0,0.04);
        }
        .form-eyebrow {
            font-size: 13px; font-weight: 500; color: var(--primary);
            letter-spacing: 0.08em; text-transform: uppercase;
            font-family: 'Inter', sans-serif; margin-bottom: 16px;
        }
        .form-title {
            font-size: clamp(30px, 4vw, 40px);
            font-family: 'Noto Serif SC', serif;
            color: var(--text-main); line-height: 1.3;
            margin-bottom: 12px;
        }
        .form-subtitle {
            font-size: 16px; color: var(--text-muted);
            line-height: 1.75; margin-bottom: 40px;
            font-family: 'Inter', sans-serif;
        }

        /* 表单 */
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block; font-size: 13px; font-weight: 500;
            color: var(--text-main); margin-bottom: 8px;
            font-family: 'Inter', sans-serif;
        }
        .form-input, .form-select {
            width: 100%; padding: 12px 16px;
            border: 1px solid var(--border); border-radius: 8px;
            font-size: 15px; color: var(--text-main);
            background: var(--bg); font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none; appearance: none;
        }
        .form-input:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(109, 74, 255, 0.08);
        }
        .form-input::placeholder { color: #9CA3AF; }
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '▾'; position: absolute; right: 16px; top: 50%;
            transform: translateY(-50%); color: var(--text-muted);
            pointer-events: none; font-size: 14px;
        }

        .form-submit {
            width: 100%; padding: 14px 24px;
            background: var(--primary); color: #FFFFFF;
            border: none; border-radius: 8px;
            font-size: 15px; font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer; transition: background 0.2s;
            margin-top: 8px;
        }
        .form-submit:hover { background: var(--primary-dark, #5A3DD1); }
        .form-submit:disabled { background: #9CA3AF; cursor: not-allowed; }

        .form-note {
            text-align: center; font-size: 13px;
            color: var(--text-muted); margin-top: 16px;
            line-height: 1.6; font-family: 'Inter', sans-serif;
        }

        /* 成功状态 */
        .success-state {
            display: none; text-align: center; padding: 20px 0;
        }
        .success-icon {
            width: 56px; height: 56px;
            background: rgba(109, 74, 255, 0.08);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 24px;
            font-size: 24px;
        }
        .success-title {
            font-size: 24px; font-family: 'Noto Serif SC', serif;
            color: var(--text-main); margin-bottom: 12px;
        }
        .success-text {
            font-size: 15px; color: var(--text-muted);
            line-height: 1.7; font-family: 'Inter', sans-serif;
            max-width: 360px; margin: 0 auto;
        }
        .success-back {
            display: inline-block; margin-top: 32px;
            font-size: 14px; color: var(--primary);
            font-family: 'Inter', sans-serif;
            text-decoration: underline; cursor: pointer;
        }

        /* 信息点横向 */
        .side-info {
            width: 100%; max-width: 580px;
            display: flex; gap: 0; z-index: 1;
            margin-top: 28px;
            border-top: 1px solid var(--border);
            padding: 28px 48px 0 48px;
        }
        .side-info-item {
            flex: 1; display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
            padding: 0 20px 0 0;
            border-right: 1px solid var(--border);
        }
        .side-info-item:last-child { border-right: none; padding-right: 0; padding-left: 20px; }
        .side-info-item:first-child { padding-left: 0; }
        .side-info-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--primary); flex-shrink: 0; margin-bottom: 2px;
        }
        .side-info-text {
            font-size: 14px; color: var(--text-muted);
            line-height: 1.65; font-family: 'Inter', sans-serif;
        }
        .side-info-text strong {
            display: block; color: var(--text-main);
            font-weight: 500; margin-bottom: 2px;
        }

        .side-info-text strong { display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 4px; }
        /* footer */
        footer { padding: 40px; background: var(--bg); border-top: 1px solid var(--border); }
        .footer-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--text-muted); }

        /* mobile */
        @media (max-width: 768px) {
            .top-nav-links { display: none; }
            .hamburger { display: flex; }
            .main-section { padding: 100px 24px 60px; }
            .side-info { display: none; }
            .form-card { max-width: 100%; }
            footer { padding: 40px 20px; }
            .footer-content { flex-direction: column; gap: 12px; text-align: center; }
        }

    </style>
</head>
<body>

    <!-- 导航 -->
    <nav class="top-nav">
        <div class="top-nav-inner">
            <a href="/" class="top-nav-logo">
                <img src="/images/logo.png" alt="回客" style="height: 36px; width: auto; display: block;">
            </a>
            <div class="top-nav-links">
                <a href="/how-it-works.html" class="top-nav-link">产品</a>
                <a href="/partner.html" class="top-nav-link">Partner</a>
            </div>
            <button class="hamburger" id="hamburger" aria-label="菜单">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>
    <div class="mobile-menu" id="mobile-menu">
        <a href="/how-it-works.html" class="mobile-menu-link">产品</a>
        <a href="/partner.html" class="mobile-menu-link">Partner</a>
    </div>

    <!-- 主内容 -->
    <section class="main-section">
        <div class="ambient-glow ambient-glow-1"></div>
        <div class="ambient-glow ambient-glow-2"></div>

        <!-- 表单 -->
        <div class="form-card">

                <a href="https://mcnmm7o8z4hq.feishu.cn/share/base/form/shrcn8dZjroLNPuxDJnOg8IjeIb" target="_blank" class="form-submit" style="display:block;text-align:center;text-decoration:none;margin-top:32px;">填写体验申请</a>
            </div>
            <div class="success-state" id="success-state" style="display:none;">

                <p class="success-text">我们会在 24 小时内与你联系，协助完成门店设置。</p>
                
            </div>
        </div>

        <!-- 右侧信息（桌面端） -->
        <div class="side-info">
            <div class="side-info-item">
                <div class="side-info-dot"></div>
                <div class="side-info-text">
                    <strong>人工引导创建</strong>
                    协助完成门店设置
                </div>
            </div>
            <div class="side-info-item">
                <div class="side-info-dot"></div>
                <div class="side-info-text">
                    <strong>体验支持</strong>
                    帮助完成首次使用
                </div>
            </div>
            <div class="side-info-item">
                <div class="side-info-dot"></div>
                <div class="side-info-text">
                    <strong>持续优化</strong>
                    根据反馈持续改进
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <div>回客 ｜ 让每一段关系都不被遗忘</div>
            <div>© 上海神工天降智能科技有限公司</div>
        </div>
    </footer>

    <script>
        // 导航汉堡
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobile-menu');
        if (hamburger && mobileMenu) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('open');
                mobileMenu.classList.toggle('open');
            });
        }

        // 表单提交
        

            </script>
</body>
</html>
